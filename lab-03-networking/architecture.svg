<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Segoe UI, Arial, sans-serif">
  <title>Lab 3: hub and spoke with peering and two NSGs</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs>
  <rect width="680" height="400" fill="#FFFFFF"/>
  <rect x="40" y="40" width="260" height="290" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="170" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">vnet-hub</text>
  <text x="170" y="86" text-anchor="middle" font-size="12" fill="#5F5E5A">10.0.0.0/16</text>
  <rect x="60" y="104" width="220" height="206" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="170" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Subnet default</text>
  <text x="170" y="148" text-anchor="middle" font-size="12" fill="#0F6E56">10.0.0.0/24</text>
  <rect x="80" y="216" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/>
  <text x="170" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">vm-hub</text>
  <text x="170" y="260" text-anchor="middle" font-size="12" fill="#5F5E5A">10.0.0.4</text>
  <rect x="380" y="40" width="260" height="290" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="510" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">vnet-spoke</text>
  <text x="510" y="86" text-anchor="middle" font-size="12" fill="#5F5E5A">10.1.0.0/16</text>
  <rect x="400" y="104" width="220" height="206" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="510" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Subnet snet-app</text>
  <text x="510" y="148" text-anchor="middle" font-size="12" fill="#0F6E56">10.1.1.0/24</text>
  <rect x="420" y="162" width="180" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="510" y="182" text-anchor="middle" font-size="12" fill="#712B13">nsg-snet-app: deny ICMP</text>
  <rect x="414" y="210" width="192" height="68" rx="10" fill="none" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="420" y="216" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/>
  <text x="510" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">vm-spoke</text>
  <text x="510" y="260" text-anchor="middle" font-size="12" fill="#5F5E5A">10.1.1.4</text>
  <text x="510" y="298" text-anchor="middle" font-size="12" fill="#712B13">NIC NSG: deny SSH</text>
  <text x="340" y="170" text-anchor="middle" font-size="12" fill="#5F5E5A">Peering</text>
  <line x1="304" y1="186" x2="376" y2="186" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="60" y="356" width="16" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
